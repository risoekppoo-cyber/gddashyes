name: Geode deferred callback
on:
  push:
    paths:
      - '.github/workflows/geode-deferred.yml'
      - 'experiments/geode-binary/inspect-deferred.py'
      - 'experiments/geode-binary/build-deferred.py'
      - 'integration-tests/deferred-reference.mjs'
      - 'integration-tests/bundle-services.mjs'
      - 'integration-tests/browser-smoke.cjs'
      - 'experiments/geode-binary/windows-srw.mjs'
      - 'experiments/geode-binary/windows-modules.mjs'
      - 'experiments/geode-binary/windows-crt.mjs'
      - 'experiments/geode-binary/windows-encoding.mjs'
      - 'experiments/geode-binary/windows-paths.mjs'
      - 'experiments/geode-binary/windows-files.mjs'
      - 'experiments/geode-binary/windows-lifecycle.mjs'
      - 'experiments/geode-binary/windows-input.mjs'
      - 'experiments/geode-binary/windows-debugger.mjs'
      - 'experiments/geode-binary/windows-console.mjs'
      - 'experiments/geode-binary/windows-stdio.mjs'
      - 'experiments/geode-binary/windows-pipes.mjs'
      - 'experiments/geode-binary/windows-critical.mjs'
      - 'experiments/geode-binary/windows-iocp.mjs'
      - 'experiments/geode-binary/thread-boundary.mjs'
      - 'experiments/geode-binary/windows-exception-ptr.mjs'
      - 'integration-tests/windows-exception-ptr.mjs'
      - 'experiments/geode-binary/guest-scheduler.mjs'
      - 'integration-tests/guest-scheduler.mjs'
      - 'experiments/geode-binary/game-imports.mjs'
      - 'experiments/geode-binary/setup-context.mjs'
      - 'experiments/geode-binary/handoff/runtime.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deferred:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r experiments/geode-binary/requirements.txt
      - name: Prepare real game header fixture
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p integration-input
          python experiments/geode-binary/fetch-startup-dll.py /tmp/Geode.dll
          cp /tmp/Geode.dll integration-input/Geode.dll
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gd-http.log 2>&1 &
          if [ ! -f integration-input/cocos-binding.json ]; then GEODE_CAPTURE_HEADERS=1 node integration-tests/browser-smoke.cjs; fi
      - run: |
          python experiments/geode-binary/build-deferred.py /tmp/Geode.dll /tmp/deferred
          clang --target=wasm32 -O2 -nostdlib /tmp/deferred/deferred.c -Wl,--no-entry -Wl,--import-memory -Wl,--export=lift_run -Wl,--export=__stack_pointer -Wl,-z,stack-size=65536 -o /tmp/deferred/deferred.wasm
          node integration-tests/bundle-services.mjs /tmp/deferred
          node integration-tests/deferred-reference.mjs /tmp/deferred
          node integration-tests/windows-srw.mjs
          node integration-tests/windows-modules.mjs
          node integration-tests/windows-crt.mjs
          node integration-tests/windows-encoding.mjs
          node integration-tests/windows-paths.mjs
          node integration-tests/windows-files.mjs
          node integration-tests/windows-lifecycle.mjs
          node integration-tests/windows-input.mjs
          node integration-tests/windows-debugger.mjs
          node integration-tests/windows-console.mjs
          node integration-tests/windows-stdio.mjs
          node integration-tests/windows-pipes.mjs
          node integration-tests/windows-critical.mjs
          node integration-tests/windows-iocp.mjs
          node integration-tests/thread-boundary.mjs
          node integration-tests/windows-exception-ptr.mjs
          node integration-tests/guest-scheduler.mjs
          cp /tmp/deferred/deferred.wasm experiments/geode-binary/handoff/setup.wasm
          cp /tmp/deferred/runtime-manifest.json experiments/geode-binary/handoff/setup-manifest.json
          cp /tmp/deferred/services.mjs experiments/geode-binary/handoff/setup-services.mjs
      - name: Test setup in the real browser
        run: |
          GEODE_DEFERRED=1 node integration-tests/browser-smoke.cjs
      - name: Publish only verified generated setup module and evidence
        run: |
          cp /tmp/deferred/reference-result.json experiments/geode-binary/handoff/setup-reference-result.json
          cp browser-result.json experiments/geode-binary/handoff/setup-browser-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f experiments/geode-binary/handoff/setup.wasm
          git add experiments/geode-binary/handoff/setup-manifest.json experiments/geode-binary/handoff/setup-reference-result.json experiments/geode-binary/handoff/setup-browser-result.json experiments/geode-binary/handoff/setup-services.mjs
          git add -f integration-input/game-headers.json
          git add -f integration-input/cocos-binding.json
          git diff --cached --quiet || git commit -m 'Publish native-reference and browser-verified deferred setup module'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deferred-inspection
          path: |
            deferred-inspection.json
            /tmp/deferred/manifest.json
            /tmp/deferred/reference-result.json
            /tmp/deferred/deferred.wasm
            /tmp/deferred/runtime-manifest.json
            /tmp/deferred/services.mjs
            browser-result.json
