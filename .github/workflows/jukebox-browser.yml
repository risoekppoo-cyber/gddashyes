name: Jukebox server song replacement
on:
  push:
    paths:
      - 'index.html'
      - 'mods/jukebox.js'
      - 'mods/tools.js'
      - 'mods/clicksounds/**'
      - 'integration-tests/clicksounds-browser.cjs'
      - 'integration-tests/jukebox-browser.cjs'
      - '.github/workflows/jukebox-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check mods/jukebox.js
          node --check mods/tools.js
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/jukebox-http.log 2>&1 &
          node integration-tests/jukebox-browser.cjs
          node integration-tests/clicksounds-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jukebox-server-replacement
          path: |
            test-results/jukebox/
            test-results/clicksounds/

