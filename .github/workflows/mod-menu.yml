name: Browser mod menu
on:
  push:
    paths:
      - 'index.html'
      - 'mods/**'
      - 'integration-tests/mod-menu-browser.cjs'
      - '.github/workflows/mod-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check mods/menu.js
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify menu in the real game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/menu-http.log 2>&1 &
          node integration-tests/mod-menu-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-menu-browser
          path: |
            mod-menu-result.json
            mod-menu-*.png
