name: Geode DLL startup service test
on:
  push:
    paths:
      - '.github/workflows/geode-startup.yml'
      - 'experiments/geode-binary/windows-time.mjs'
      - 'experiments/geode-binary/startup-smoke.py'
      - 'experiments/geode-binary/verify-startup.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused test dependencies
        run: |
          python -m pip install -r experiments/geode-binary/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
      - name: Test the time-service contract
        run: node experiments/geode-binary/verify-windows-time.mjs
      - name: Fetch hash-pinned official DLL
        run: |
          mkdir -p /tmp/geode-startup
          python experiments/geode-binary/fetch-startup-dll.py /tmp/geode-startup/Geode.dll
      - name: Continue actual DLL startup and compare WASM
        run: |
          python experiments/geode-binary/startup-smoke.py /tmp/geode-startup/Geode.dll /tmp/geode-startup > /tmp/geode-startup/report.json
          cat /tmp/geode-startup/report.json
          test -f /tmp/geode-startup/startup.c
          clang --target=wasm32 -O2 -nostdlib /tmp/geode-startup/startup.c -Wl,--no-entry -Wl,--import-memory -Wl,--export=lift_run -Wl,-z,stack-size=0 -Wl,--initial-memory=131072 -Wl,--max-memory=4294967296 -o /tmp/geode-startup/startup.wasm
          node experiments/geode-binary/verify-startup.mjs /tmp/geode-startup /tmp/geode-startup/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geode-startup-report
          path: /tmp/geode-startup/report.json
