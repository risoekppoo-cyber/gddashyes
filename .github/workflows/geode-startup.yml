name: Geode DLL startup service test
on:
  push:
    paths:
      - '.github/workflows/geode-startup.yml'
      - 'experiments/geode-binary/*.mjs'
      - 'experiments/geode-binary/*.py'
      - 'experiments/geode-binary/*.sh'
      - 'experiments/geode-binary/cpu-profile.json'
      - 'experiments/geode-binary/windows-profile.json'
      - 'experiments/geode-binary/c-locale-reference.json'
      - 'experiments/fmod-bridge/adapter-map.json'
      - 'experiments/fmod-bridge/result.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [geode, vcruntime, combined]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install focused test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libarchive-tools
          python -m pip install -r experiments/geode-binary/requirements.txt
          python -m pip install ziglang==0.14.1
          npm install --prefix /tmp/geode-wasm-tools binaryen@123.0.0
      - name: Fetch hash-pinned official DLL
        run: |
          mkdir -p /tmp/geode-startup
          python experiments/geode-binary/fetch-startup-dll.py /tmp/geode-startup/Geode.dll
          python experiments/geode-binary/fetch_cocos_image.py /tmp/geode-startup/libcocos2d.dll.img
          python experiments/geode-binary/fetch_primary_image.py /tmp/geode-startup/GeometryDash.exe.img
          python experiments/geode-binary/fetch_msvc_slice.py /tmp/geode-startup/msvcp140-x64.dll
          python experiments/geode-binary/fetch_vcruntime.py /tmp/geode-startup/vcruntime140-x64.dll
      - name: Verify actual DLL startup and boundary contracts
        env:
          GEODE_FMOD_BRIDGE: ${{ matrix.mode == 'combined' && '1' || '' }}
          GEODE_GENERATED_CODE: ${{ matrix.mode == 'combined' && '1' || '' }}
          GEODE_MSVCP_BOOT: '1'
          GEODE_INSTRUCTION_LIMIT: 2000000
          GEODE_DLL: /tmp/geode-startup/Geode.dll
          GEODE_COCOS_IMG: /tmp/geode-startup/libcocos2d.dll.img
          GEODE_PRIMARY_IMG: /tmp/geode-startup/GeometryDash.exe.img
          GEODE_MSVCP_DLL: /tmp/geode-startup/msvcp140-x64.dll
          GEODE_VCRUNTIME_DLL: ${{ matrix.mode != 'geode' && '/tmp/geode-startup/vcruntime140-x64.dll' || '' }}
          GEODE_VCRUNTIME_ONLY: ${{ matrix.mode == 'vcruntime' && '1' || '' }}
          GEODE_OUT: /tmp/geode-startup/${{ matrix.mode }}
          GEODE_WASM_OPT: /tmp/geode-wasm-tools/node_modules/.bin/wasm-opt
        run: bash experiments/geode-binary/run-startup-tests.sh
      - name: Check actual emitted patch and trampoline
        if: matrix.mode == 'combined'
        run: |
          python experiments/geode-binary/build-generated-check.py /tmp/geode-startup/combined /tmp/geode-generated
          GEODE_GENERATED_OUT=/tmp/geode-generated bash experiments/geode-binary/generated/build.sh
          node experiments/geode-binary/generated/verify-node.mjs /tmp/geode-generated
          python - <<'PY'
          from pathlib import Path
          for name in ['original', 'patched', 'trampoline']:
              assert Path('/tmp/geode-generated/'+name+'.wasm').read_bytes() == Path('experiments/geode-binary/generated/'+name+'.wasm').read_bytes(), name+' committed WASM differs from rebuild'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geode-startup-report-${{ matrix.mode }}
          path: /tmp/geode-startup/${{ matrix.mode }}/report.json
