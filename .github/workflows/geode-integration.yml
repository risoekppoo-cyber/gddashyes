name: Geode live handoff integration
on:
  push:
    paths:
      - '.github/workflows/geode-integration.yml'
      - 'integration-tests/TASK_05_tests.cjs'
      - 'integration-tests/TASK_06_tests.cjs'
      - 'integration-tests/TASK_08_mock_test.cjs'
      - 'integration-tests/prologue.mjs'
      - 'experiments/geode-binary/fetch-startup-dll.py'
      - 'integration-tests/owned-image.mjs'
      - 'integration-tests/browser-smoke.cjs'
      - 'integration-tests/memory-intervals*.mjs'
      - 'experiments/geode-binary/handoff/runtime.js'
      - 'experiments/geode-binary/handoff/index.html'
      - 'experiments/geode-binary/handoff/prologue.wasm'
      - 'experiments/geode-binary/handoff/manifest.json'
      - 'experiments/geode-binary/handoff/startup-module.mjs'
      - 'experiments/geode-binary/owned-image.mjs'
      - 'experiments/geode-binary/mapped/**'
      - 'experiments/geode-binary/generated/startup-module.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore pinned DLL cache
        uses: actions/cache@v4
        with:
          path: integration-input/Geode.dll
          key: geode-startup-dll-ccedc2f1c86baf342f6720b9685991ca31fba246453efe2a1daf609dc40b6499
      - name: Focused checks and real prologue references
        run: |
          node integration-tests/TASK_05_tests.cjs
          node integration-tests/TASK_06_tests.cjs
          node integration-tests/TASK_08_mock_test.cjs experiments/geode-binary/handoff/runtime.js
          node --test integration-tests/memory-intervals.test.mjs
          node integration-tests/prologue.mjs
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real game handoff
        run: |
          mkdir -p integration-input
          python3 experiments/geode-binary/fetch-startup-dll.py integration-input/Geode.dll
          node integration-tests/owned-image.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/gd-http.log 2>&1 &
          node integration-tests/browser-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-handoff-result
          path: browser-result.json
